##
# Applies new migrations to the hosted Supabase project when `main` moves.
#
# This is the one piece of deployment the portal does not get from Vercel.
# Vercel builds and ships the application on its own; the database it talks to
# is a separate system that until now was migrated by hand from a laptop, which
# means the schema in production depended on somebody remembering. It no longer
# does.
#
# Supabase's "Managing Environments" guide recommends deploying migrations from
# CI rather than from a laptop, and documents this with three secrets — the
# third being `SUPABASE_DB_PASSWORD`. It is deliberately absent here.
#
# CLI 2.111 does not use it. On a linked project it asks the Management API to
# mint a temporary database login role (`POST /v1/projects/{ref}/cli/login-role`)
# and connects with that, so the access token is the only credential needed.
# Verified by running `db push --debug` against this project. If a future CLI
# starts prompting for a password in CI, that is the reason — and the fix is to
# add the secret back, not to work around the prompt.
#
# Leaving it out matters. A database password is a standing credential that
# grants direct SQL access from anywhere, with no row level security in the way,
# and rotating it means finding everywhere it was used. The access token is
# revocable from the Supabase dashboard in one click.
#
# It is not harmless, though: a Supabase personal access token carries the same
# privileges as the account that made it, across every organization that
# account belongs to — there is no scoped variant. Generate it from an account
# that belongs to nothing else. Four things keep it from leaking, and none of
# them is optional:
#
#   1. The secrets live on the `production` environment, not on the repository,
#      so only a job naming that environment can read them.
#   2. That environment restricts deployments to `main`. Without the rule,
#      anyone who can push a branch could add a job naming `production` and
#      read the token out; with it, GitHub refuses before handing anything over.
#   3. Every action below is pinned to a commit rather than a tag. A tag can be
#      moved to point at different code; a commit cannot. Without this, whoever
#      controls one of these actions could publish a release that exfiltrates
#      the token.
#   4. Branch protection on `main`. Anyone who can change this file can make it
#      do anything, with these secrets in hand.
#
# Secrets are never passed to workflows triggered from a fork, so a stranger's
# pull request cannot reach these however the file is written.
#
# `supabase db push --include-all` applies only migration versions the project
# has not seen, including a corrective migration that must sort immediately
# before the migration it repairs. Migrations in this repository are
# append-only (see AGENTS.md), so this never rewrites anything already applied.
#
# WHAT IT CANNOT DO: it cannot order itself against the Vercel deploy. Both are
# triggered by the same push and race. In practice the migration wins — this
# workflow finishes in under a minute and a Next.js build does not — but that is
# a tendency, not a guarantee. Write migrations an older application can
# survive: add before you remove, and drop a column in a later commit than the
# one that stopped reading it. That discipline is worth more than any sequencing
# this file could enforce.
##
name: Migrate database

on:
  push:
    branches: [main]
  # Available by hand from the Actions tab, for re-running a migration that
  # failed on a transient error without needing an empty commit.
  workflow_dispatch:

# Two pushes in quick succession must not apply migrations concurrently: the
# second would race the first against the same project. No cancel-in-progress —
# a migration that has started must be allowed to finish.
concurrency:
  group: migrate-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Apply migrations to production
    runs-on: ubuntu-latest
    # Create this in Settings → Environments. Add a required reviewer and every
    # schema change waits for a human — worth turning on once more than one
    # person is committing.
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3

      # The project ref is passed through the environment rather than
      # interpolated into the script. A `${{ }}` expression is pasted into the
      # shell before it runs, so a value containing shell syntax would execute
      # as a command — the standard way script injection reaches a runner.
      - name: Link to the hosted project
        env:
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref "$PROJECT_ID"

      - name: List pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        # Prints what is about to be applied, so the log records which
        # migrations this run was responsible for even if the push then fails.
        run: supabase migration list

      - name: Apply them
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --include-all
