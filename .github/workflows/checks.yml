##
# Everything that must be true before a change reaches production.
#
# Vercel deploys `main` automatically, so on a push this workflow reports after
# the fact — it is on pull requests that it actually prevents anything. Make
# both jobs required status checks on `main` and require a pull request, and
# the two become the same thing.
#
# No secrets are used, and none should be added. Both jobs run entirely against
# local throwaway state: the build reads no environment at all, and the
# database job boots its own Postgres. That is what makes this workflow safe on
# pull requests from forks — the repository is public, and a stranger's branch
# must never be able to reach the real project.
#
# Actions are pinned to a commit rather than a tag. A tag can be moved to point
# at different code; a commit cannot. The comment after each is the version it
# was, and Dependabot updates both together.
##
name: Checks

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: Types, lint, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      # Refuses to run if the lockfile and package.json disagree, rather than
      # quietly resolving something newer than what was reviewed.
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      # The pure rules only — who counts as an alumnus, who may be offered the
      # administrator role. Anything that reads the database is covered by the
      # job below, against a real Postgres.
      - run: pnpm test

      - run: pnpm build

  database:
    name: Migrations and authorization tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Docker is already running on GitHub's Ubuntu runners, which is all the
      # local Supabase stack needs. With no `version` given, the action installs
      # the CLI version pinned in this repository's lockfile — so CI runs the
      # same one developers do.
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3

      # This job uses Postgres directly. Starting Mailpit, Studio and the API
      # services adds host ports and can collide with software on a hosted
      # runner without testing anything this job depends on.
      - name: Start the local Supabase stack
        run: >-
          supabase start --exclude
          gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      # Applies every migration to an empty database. This is the half that
      # catches a migration which only works against the deployed project — one
      # that assumes a column an earlier edited migration no longer creates, or
      # that depends on the order it happened to be applied in.
      - name: Apply every migration from scratch
        run: supabase db reset --local

      # And this is the half that catches a migration which applies cleanly but
      # changes what the database will let people do. Row level security and the
      # `security definer` functions are the whole authorization model here, so
      # a regression in them is a data breach rather than a bug.
      - name: Run the authorization suite
        run: supabase test db --local supabase/tests/database/authorization.test.sql
